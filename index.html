<style>
  @font-face { font-family: 'system-mono'; src: local('SF Mono'), local('Consolas'), local('Menlo'); }
  :root {
    --bg: #EEEFF2;
    --panel: #FFFFFF;
    --panel-2: #F4F5F7;
    --line: #E3E4E8;
    --ink: #15171C;
    --ink-dim: #86898F;
    --accent: #E0A640;
    --teal: #3C8F86;
    --rust: #C96A4E;
    --shadow: 0 8px 24px rgba(20,20,25,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    position: fixed; width: 100%; overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
  }
  .page-body, textarea.bigwrite { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .mono { font-family: "SF Mono", "Consolas", "Menlo", monospace; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

  .pages { flex: 1; position: relative; overflow: hidden; }
  .page { position: absolute; inset: 0; display: none; flex-direction: column; }
  .page.active { display: flex; }

  #writePage { padding: 0; position: relative; overflow: hidden; }
  .hero-full {

  }
  .hero-full img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-full::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(8,8,12,0.75) 100%);
  }
  .hero-full.fallback::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,210,120,0.9), transparent),
      radial-gradient(2px 2px at 65% 20%, rgba(255,180,90,0.8), transparent),
      radial-gradient(1.5px 1.5px at 80% 55%, rgba(255,230,160,0.7), transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,200,110,0.6), transparent),

  .bell-badge {
    position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px;

    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }

  textarea.bigwrite {
    flex: 1; width: 100%; resize: none; border: none; outline: none;

  .todo-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; padding: 0; margin-top: 1px; }

  .todo-when { padding: 2px 8px; border-radius: 999px; background: var(--panel-2); }
  .todo-when.urgent { background: rgba(201,106,78,0.14); color: #a8442a; font-weight: 600; }
  .todo-who { padding: 2px 8px; border-radius: 999px; background: rgba(60,143,134,0.12); color: #276b64; }

  .cat-section { margin-bottom: 24px; }
  .cat-h { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .cat-count { color: var(--ink-dim); font-weight: 400; font-size: 12px; }
  .cat-desc { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 10px; line-height: 1.4; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .cat-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }

  .cat-name { font-size: 13.5px; flex: 1; }
  .cat-num { font-size: 11px; color: var(--ink-dim); background: var(--panel-2); border-radius: 999px; padding: 1px 8px; }
  .cat-acts { display: flex; gap: 4px; }
  .cat-acts button { font-size: 10.5px; padding: 4px 8px; }

  ::-webkit-scrollbar { width: 8px; }

    .app {
      max-width: 430px; width: 100%; height: 100vh;
      box-shadow: 0 0 60px rgba(0,0,0,0.18);
      position: relative; overflow: hidden;
    }
  }
</style>

  });
  const data = await resp.json();
  if(data.access_token){ accessToken = data.access_token; if(data.refresh_token) setRefresh(data.refresh_token); return true; }
  return false;
}

async function dbxRefreshToken(){
  const rt = getRefresh();
  if(!rt) return false;
  const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token', refresh_token:rt, client_id:DBX_APP_KEY})
  });
  const data = await resp.json();
  if(data.access_token){ accessToken = data.access_token; return true; }
  return false;
}

function isLoggedIn(){ return !!getRefresh(); }

// ---------- LETTURA / SCRITTURA FILE ----------
async function dbxRead(){
  const resp = await fetch('https://content.dropboxapi.com/2/files/download', {
    method:'POST', headers:{'Authorization':'Bearer '+accessToken, 'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE})}
  });
  if(resp.status===409) return null; // file non ancora esistente
  if(!resp.ok) throw new Error('lettura HTTP '+resp.status);
  return await resp.text();
}
async function dbxWrite(content){
  const resp = await fetch('https://content.dropboxapi.com/2/files/upload', {
    method:'POST',
    headers:{'Authorization':'Bearer '+accessToken, 'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE, mode:'overwrite', mute:true}), 'Content-Type':'application/octet-stream'},
    body: content
  });
  if(!resp.ok) throw new Error('scrittura HTTP '+resp.status);
  return await resp.json();
}

async function loadNotes() {
  updateAuthUI();
  if(!isLoggedIn()){ setStatus('collega Dropbox per iniziare'); notes=[]; render(); return; }
  setStatus('carico da Dropbox…');
  try {
    if(!accessToken){ const ok = await dbxRefreshToken(); if(!ok){ setStatus('sessione scaduta, ricollega Dropbox'); localStorage.removeItem('dbx_refresh'); updateAuthUI(); return; } }
    const raw = await dbxRead();
    if(raw){
      const parsed = JSON.parse(raw);
      notes = Array.isArray(parsed) ? parsed : (parsed.notes || []);
      permanentCategories = (parsed && Array.isArray(parsed.permanentCategories)) ? parsed.permanentCategories : [];
      bannedCategories = (parsed && Array.isArray(parsed.bannedCategories)) ? parsed.bannedCategories : [];
      todos = (parsed && Array.isArray(parsed.todos)) ? parsed.todos : [];
    } else {
      // file non esiste ancora: primo avvio, semino con le note di prova
      notes = SEED_NOTES;
      await persist();
    }
    setStatus('sincronizzato');
  } catch (e) {
    notes = [];
    setStatus('errore: ' + (e.message || 'caricamento fallito'));
  }
  render();
}

async function persist() {
  if(!isLoggedIn()){ setStatus('non collegato: modifiche non salvate'); return; }
  setStatus('salvo su Dropbox…');
  try {
    if(!accessToken){ await dbxRefreshToken(); }
    const envelope = { schemaVersion: SCHEMA_VERSION, notes, permanentCategories, bannedCategories, todos };
    await dbxWrite(JSON.stringify(envelope, null, 2));
    setStatus('salvato');
  } catch (e) {
    setStatus('errore salvataggio: ' + (e.message || ''));
  }
}

function updateAuthUI(){
  const btn = document.getElementById('authBtn');
  if(!btn) return;
  if(isLoggedIn()){ btn.textContent = '✓ Dropbox'; btn.classList.add('connected'); }
  else { btn.textContent = 'Collega Dropbox'; btn.classList.remove('connected'); }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function saveNote() {
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';

  notes.unshift({
    id: uid(),
    text,
    created: new Date().toISOString(),
    category: 'Da ordinare',
    tags: [],
    links: [],
    customCategories: [],
    source: 'text',
    reminderDate: null,
    analyzing: false
  });
  render();
  await persist();
}

function render() {
  renderList();
  updateBell();
  if (document.getElementById('mapPage').classList.contains('active')) renderMap();
  if (document.getElementById('catPage').classList.contains('active')) renderCategories();
  if (document.getElementById('todoPage').classList.contains('active')) renderTodos();
}

function todoUrgency(t) {
  // 'scaduto' | 'oggi' | 'futuro' | null  — basato su t.due (ISO) se presente
  if (t.done || !t.due) return null;
  const now = new Date();
  const due = new Date(t.due);
  if (isNaN(due.getTime())) return null;
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startDue = new Date(due.getFullYear(), due.getMonth(), due.getDate());
  const diffDays = Math.round((startDue - startToday) / 86400000);
  if (diffDays < 0) return 'scaduto';
  if (diffDays === 0) return 'oggi';
  if (diffDays === 1) return 'domani';
  return 'futuro';
}

function countUrgent() {
  return todos.filter(t => { const u = todoUrgency(t); return u === 'scaduto' || u === 'oggi' || u === 'domani'; }).length;
}

function updateBell() {
  const n = countUrgent();
  const bell = document.getElementById('bellBtn');
  const badge = document.getElementById('bellBadge');
  if (!bell) return;
  if (n > 0) {
    bell.classList.add('urgent');
    badge.style.display = 'flex';
    badge.textContent = n;
  } else {
    bell.classList.remove('urgent');
    badge.style.display = 'none';
  }
}

function renderTodos() {
  const el = document.getElementById('todoView');
  if (!todos.length) {
    el.innerHTML = '<div class="empty">Nessun impegno ancora. Compaiono qui quando le note vengono ordinate (giorni, persone e orari estratti dal testo).</div>';
    return;
  }
  // raggruppa per categoria, ordina i gruppi per urgenza max interna
  const byCat = {};
  todos.forEach(t => { const c = t.category || 'Da ordinare'; (byCat[c] = byCat[c] || []).push(t); });
  const urgencyRank = { 'scaduto': 0, 'oggi': 1, 'domani': 2, 'futuro': 3, null: 4 };
  const cats = Object.keys(byCat).sort((a, b) => {
    const ma = Math.min(...byCat[a].map(t => urgencyRank[todoUrgency(t)]));
    const mb = Math.min(...byCat[b].map(t => urgencyRank[todoUrgency(t)]));
    return ma - mb;
  });

  let html = '';
  cats.forEach(cat => {
    const color = (cat === 'Da ordinare') ? '#9a8f6a' : colorFor(cat);
    const items = byCat[cat].sort((a, b) => urgencyRank[todoUrgency(a)] - urgencyRank[todoUrgency(b)]);
    html += `<div class="todo-cat"><div class="todo-cat-h" style="--cat-color:${color}"><span class="dot"></span>${escapeHtml(cat)}</div>`;
    items.forEach(t => {
      const u = todoUrgency(t);
      const whenLabel = t.due ? (u === 'scaduto' ? 'scaduto' : u === 'oggi' ? 'oggi' : u === 'domani' ? 'domani' : new Date(t.due).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' })) : '';
      const timeLabel = t.time ? ' ' + t.time : '';
      html += `<div class="todo-item ${t.done ? 'done' : ''}">
        <button class="todo-check ${t.done ? 'on' : ''}" data-toggle="${t.id}">${t.done ? '✓' : ''}</button>
        <div class="todo-body">
          <div class="todo-text">${escapeHtml(t.text)}</div>
          <div class="todo-meta">
            ${whenLabel ? `<span class="todo-when ${(u==='scaduto'||u==='oggi'||u==='domani')?'urgent':''}">${whenLabel}${timeLabel}</span>` : ''}
            ${t.who ? `<span class="todo-who">${escapeHtml(t.who)}</span>` : ''}
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  el.innerHTML = html;

  el.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const t = todos.find(x => x.id === b.getAttribute('data-toggle'));
    if (t) { t.done = !t.done; renderTodos(); updateBell(); await persist(); }
  });
}

function renderCategories() {
  const el = document.getElementById('catView');
  // conteggio categorie realmente in uso nelle note
  const inUse = {};
  notes.forEach(n => {
    const c = n.category || 'Da ordinare';
    inUse[c] = (inUse[c] || 0) + 1;
  });
  const usedNames = Object.keys(inUse).sort((a, b) => inUse[b] - inUse[a]);

  let html = `<div class="cat-section">
    <div class="cat-h">Permanenti <span class="cat-count">(${permanentCategories.length}/20)</span></div>
    <div class="cat-desc">La tua tassonomia ufficiale. Quando ordino le note, preferisco sempre queste.</div>
    <div class="cat-chips">
      ${permanentCategories.map(c => `<span class="cat-chip perm">${escapeHtml(c)} <span class="rm" data-rmperm="${escapeHtml(c)}">×</span></span>`).join('') || '<span class="cat-empty">nessuna ancora</span>'}
    </div>
  </div>`;

  html += `<div class="cat-section">
    <div class="cat-h">Vietate</div>
    <div class="cat-desc">Non le userò mai. Marcandone una, le note che ce l'hanno tornano subito a "Da ordinare".</div>
    <div class="cat-chips">
      ${bannedCategories.map(c => `<span class="cat-chip ban">${escapeHtml(c)} <span class="rm" data-rmban="${escapeHtml(c)}">×</span></span>`).join('') || '<span class="cat-empty">nessuna ancora</span>'}
    </div>
  </div>`;

  html += `<div class="cat-section">
    <div class="cat-h">In uso ora <span class="cat-count">(${usedNames.length})</span></div>
    <div class="cat-desc">Categorie presenti nelle note in questo momento. Per ciascuna: rendila permanente o vietala.</div>`;
  usedNames.forEach(name => {
    const isPerm = permanentCategories.includes(name);
    const isBan = bannedCategories.includes(name);
    const color = (name === 'Da ordinare') ? '#9a8f6a' : colorFor(name);
    html += `<div class="cat-row">
      <span class="cat-dot" style="background:${color}"></span>
      <span class="cat-name">${escapeHtml(name)}</span>
      <span class="cat-num">${inUse[name]}</span>
      <span class="cat-acts">
        <button data-perm="${escapeHtml(name)}" ${isPerm || permanentCategories.length >= 20 ? 'disabled' : ''}>★ permanente</button>
        <button data-ban="${escapeHtml(name)}" ${isBan ? 'disabled' : ''}>⊘ vieta</button>
      </span>
    </div>`;
  });
  html += `</div>`;

  el.innerHTML = html;

  el.querySelectorAll('[data-perm]').forEach(b => b.onclick = () => addPermanent(b.getAttribute('data-perm')));
  el.querySelectorAll('[data-ban]').forEach(b => b.onclick = () => addBanned(b.getAttribute('data-ban')));
  el.querySelectorAll('[data-rmperm]').forEach(b => b.onclick = () => { permanentCategories = permanentCategories.filter(c => c !== b.getAttribute('data-rmperm')); renderCategories(); persist(); });
  el.querySelectorAll('[data-rmban]').forEach(b => b.onclick = () => { bannedCategories = bannedCategories.filter(c => c !== b.getAttribute('data-rmban')); renderCategories(); persist(); });
}

async function addPermanent(name) {
  if (permanentCategories.length >= 20 || permanentCategories.includes(name)) return;
  permanentCategories.push(name);
  bannedCategories = bannedCategories.filter(c => c !== name); // non può essere sia permanente che vietata
  renderCategories();
  await persist();
}

async function addBanned(name) {
  if (bannedCategories.includes(name)) return;
  bannedCategories.push(name);
  permanentCategories = permanentCategories.filter(c => c !== name);
  // le note con questa categoria tornano a "Da ordinare"
  let touched = 0;
  notes.forEach(n => { if (n.category === name) { n.category = 'Da ordinare'; touched++; } });
  renderCategories();
  render();
  await persist();
  if (touched) setStatus(`${touched} note rimandate a "Da ordinare"`);
}

function renderList() {
  const el = document.getElementById('listView');
  if (notes.length === 0) {
    el.innerHTML = '<div class="empty">Nessuna nota ancora. Scrivi qualcosa sopra.</div>';
    return;
  }
  const groups = {};
  notes.forEach(n => {
    const cat = n.analyzing ? '…analisi in corso' : (n.category || 'Non categorizzato');
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(n);
  });
  let html = '';
  Object.keys(groups).sort().forEach(cat => {
    const list = groups[cat];
    const color = cat.startsWith('…') ? '#5a6472' : colorFor(cat);
    html += `<div class="group"><div class="group-title" style="--cat-color:${color}"><span class="dot"></span>${escapeHtml(cat)} <span class="count">(${list.length})</span></div>`;
    list.forEach(n => {
      html += renderNote(n, color);
    });
    html += `</div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => {
      const n = notes.find(x => x.id === b.getAttribute('data-copy'));
      navigator.clipboard.writeText(n.text).then(() => { b.textContent = 'copiato'; setTimeout(() => b.textContent = 'copia', 900); });
    };
  });
  el.querySelectorAll('[data-remind]').forEach(b => {
    b.onclick = () => setReminder(b.getAttribute('data-remind'));
  });
  el.querySelectorAll('[data-rmreminder]').forEach(b => {
    b.onclick = () => clearReminder(b.getAttribute('data-rmreminder'));
  });
  el.querySelectorAll('[data-addcustom]').forEach(b => {
    b.onclick = () => addCustomCategory(b.getAttribute('data-addcustom'));
  });
  el.querySelectorAll('[data-rmcustom]').forEach(b => {
    b.onclick = () => removeCustomCategory(b.getAttribute('data-rmcustom'), b.getAttribute('data-catname'));
  });
  el.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => startEdit(b.getAttribute('data-edit'));
  });
  el.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      const id = b.getAttribute('data-del');
      if (pendingDelete.has(id)) {
        pendingDelete.delete(id);
        notes = notes.filter(n => n.id !== id);
        render();
        await persist();
      } else {
        pendingDelete.add(id);
        renderList();
        setTimeout(() => {
          if (pendingDelete.has(id)) { pendingDelete.delete(id); renderList(); }
        }, 4000);
      }
    };
  });
  el.querySelectorAll('[data-jump]').forEach(a => {
    a.onclick = () => {
      const target = document.getElementById('note-' + a.getAttribute('data-jump'));
      if (target) { target.scrollIntoView({behavior:'smooth', block:'center'}); target.style.borderColor = 'var(--amber)'; setTimeout(()=> target.style.borderColor='var(--line)', 1200); }
    };
  });
}

function renderNote(n, color) {
  const linkedTitles = (n.links || []).map(id => {
    const t = notes.find(x => x.id === id);
    return t ? `<a data-jump="${id}">${escapeHtml(t.text.slice(0,30))}…</a>` : '';
  }).filter(Boolean).join(' · ');
  const custom = n.customCategories || [];
  const customRow = `<div class="custom-cats">
    ${custom.map(c => `<span class="tag custom-tag">${escapeHtml(c)} <span data-rmcustom="${n.id}" data-catname="${escapeHtml(c)}" class="rm">×</span></span>`).join('')}
    ${custom.length < 3 ? `<button data-addcustom="${n.id}" class="addcat">+ categoria (${custom.length}/3)</button>` : ''}
  </div>`;
  const reminderBadge = n.reminderDate
    ? `<span class="tag reminder-tag" data-rmreminder="${n.id}">⏰ ${new Date(n.reminderDate).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'})} ×</span>`
    : '';
  return `<div class="note" id="note-${n.id}" style="--cat-color:${color}">
    <div class="note-text">${escapeHtml(n.text)}</div>
    ${customRow}
    <div class="note-meta">
      <span class="mono">${new Date(n.created).toLocaleString('it-IT', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      ${n.analyzing ? '<span class="pending">analisi in corso…</span>' : (n.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
      ${reminderBadge}
      <span class="note-actions">
        <button data-copy="${n.id}">copia</button>
        <button data-remind="${n.id}">⏰</button>
        <button data-edit="${n.id}">modifica</button>
        <button data-del="${n.id}" class="${pendingDelete.has(n.id) ? 'confirm-del' : ''}">${pendingDelete.has(n.id) ? 'sicuro? tocca ancora' : 'elimina'}</button>
      </span>
    </div>
    ${linkedTitles ? `<div class="note-links">collegata a: ${linkedTitles}</div>` : ''}
  </div>`;
}

function startEdit(id) {
  const n = notes.find(x => x.id === id);
  const container = document.getElementById('note-' + id);
  if (!n || !container) return;
  const textEl = container.querySelector('.note-text');
  textEl.outerHTML = `<textarea class="editArea" id="edit-${id}" style="width:100%;min-height:60px;background:var(--panel-2);border:1px solid var(--amber);color:var(--paper);padding:8px;border-radius:3px;font-family:inherit;font-size:13.5px;">${escapeHtml(n.text)}</textarea>
    <div style="margin-top:6px;display:flex;gap:6px;">
      <button data-save-edit="${id}">salva modifica</button>
      <button data-cancel-edit="${id}">annulla</button>
    </div>`;
  container.querySelector(`[data-save-edit="${id}"]`).onclick = async () => {
    const newText = document.getElementById('edit-' + id).value.trim();
    if (newText && newText !== n.text) {
      n.text = newText;
      render();
      await persist();
    } else {
      render();
    }
  };
  container.querySelector(`[data-cancel-edit="${id}"]`).onclick = () => render();
}

async function setReminder(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  const input = prompt('Richiama questa nota il (gg/mm/aaaa):', '');
  if (!input) return;
  const m = input.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) { alert('Formato non riconosciuto, usa gg/mm/aaaa'); return; }
  const [, d, mo, y] = m;
  const year = y.length === 2 ? '20' + y : y;
  const date = new Date(`${year}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}T09:00:00`);
  if (isNaN(date.getTime())) { alert('Data non valida'); return; }
  n.reminderDate = date.toISOString();
  render();
  await persist();
}

async function clearReminder(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.reminderDate = null;
  render();
  await persist();
}

async function addCustomCategory(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.customCategories = n.customCategories || [];
  if (n.customCategories.length >= 3) return;
  const name = (prompt('Nome della categoria personalizzata (max 3 per nota):') || '').trim();
  if (!name) return;
  if (n.customCategories.includes(name)) return;
  n.customCategories.push(name);
  render();
  await persist();
}

async function removeCustomCategory(id, name) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.customCategories = (n.customCategories || []).filter(c => c !== name);
  render();
  await persist();
}

let mapView = null; // {vbX, vbY, vbW, vbH, worldW, worldH}

function renderMap() {
  const host = document.getElementById('mapCanvasHost');
  const done = notes.filter(n => !n.analyzing);
  if (done.length === 0) {
    host.innerHTML = '<div class="empty">La mappa appare quando le note vengono ordinate e collegate.</div>';
    mapView = null;
    return;
  }
  const cats = [...new Set(done.map(n => n.category))];
  // spazio mondo generoso, così con molte categorie c'è respiro e si naviga con lo zoom
  const cols = Math.ceil(Math.sqrt(cats.length));
  const rows = Math.ceil(cats.length / cols);
  const cell = 260;
  const worldW = Math.max(cols * cell, 400);
  const worldH = Math.max(rows * cell, 400);

  const clusterCenters = {};
  cats.forEach((c, i) => {
    clusterCenters[c] = { x: cell * (i % cols) + cell / 2, y: cell * Math.floor(i / cols) + cell / 2 };
  });

  const byCat = {};
  done.forEach(n => (byCat[n.category] = byCat[n.category] || []).push(n));
  const positions = {};
  Object.entries(byCat).forEach(([cat, list]) => {
    const center = clusterCenters[cat];
    list.forEach((n, i) => {
      const r = list.length > 1 ? 62 : 0;
      const angle = (i / list.length) * Math.PI * 2;
      positions[n.id] = { x: center.x + Math.cos(angle) * r, y: center.y + Math.sin(angle) * r };
    });
  });

  let inner = '';
  done.forEach(n => {
    (n.links || []).forEach(lid => {
      if (positions[lid] && positions[n.id]) {
        const a = positions[n.id], b = positions[lid];
        inner += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#c7cad0" stroke-width="1.5"/>`;
      }
    });
  });
  Object.entries(clusterCenters).forEach(([cat, c]) => {
    inner += `<circle cx="${c.x}" cy="${c.y}" r="96" fill="${colorFor(cat)}22" stroke="${colorFor(cat)}" stroke-width="1.5" stroke-dasharray="3 4"/>`;
    inner += `<text x="${c.x}" y="${c.y - 104}" fill="${colorFor(cat)}" font-weight="700" font-size="13" text-anchor="middle">${escapeHtml(cat)}</text>`;
  });
  done.forEach(n => {
    const p = positions[n.id];
    inner += `<circle data-node="${n.id}" cx="${p.x}" cy="${p.y}" r="9" fill="${colorFor(n.category)}" stroke="#fff" stroke-width="2.5" style="cursor:pointer;"><title>${escapeHtml(n.text.slice(0,80))}</title></circle>`;
  });

  // stato vista iniziale: inquadra tutto il mondo
  if (!mapView || mapView.worldW !== worldW || mapView.worldH !== worldH) {
    mapView = { vbX: -20, vbY: -20, vbW: worldW + 40, vbH: worldH + 40, worldW, worldH };
  }
  const vb = `${mapView.vbX} ${mapView.vbY} ${mapView.vbW} ${mapView.vbH}`;
  host.innerHTML = `<svg id="mapSvg" width="100%" height="100%" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" style="display:block; touch-action:none;">${inner}</svg>`;

  const svg = document.getElementById('mapSvg');
  attachMapInteractions(svg);

  svg.querySelectorAll('[data-node]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (svg._dragged) return; // non aprire se stavo trascinando
      const id = el.getAttribute('data-node');
      goToPage('listPage');
      setTimeout(() => {
        const target = document.getElementById('note-' + id);
        if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); target.style.outline = '2px solid var(--accent)'; setTimeout(() => target.style.outline = 'none', 1200); }
      }, 60);
    });
  });
}

function attachMapInteractions(svg) {
  let dragging = false, lastX = 0, lastY = 0, pinchDist = 0;
  const applyVB = () => svg.setAttribute('viewBox', `${mapView.vbX} ${mapView.vbY} ${mapView.vbW} ${mapView.vbH}`);
  const zoomAt = (factor, cx, cy) => {
    // cx,cy in coordinate schermo relative al box
    const rect = svg.getBoundingClientRect();
    const px = (cx - rect.left) / rect.width, py = (cy - rect.top) / rect.height;
    const wx = mapView.vbX + px * mapView.vbW, wy = mapView.vbY + py * mapView.vbH;
    let nw = mapView.vbW * factor, nh = mapView.vbH * factor;
    nw = Math.max(120, Math.min(mapView.worldW * 3, nw));
    nh = Math.max(120, Math.min(mapView.worldH * 3, nh));
    mapView.vbX = wx - px * nw; mapView.vbY = wy - py * nh;
    mapView.vbW = nw; mapView.vbH = nh;
    applyVB();
  };

  svg.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 1.12 : 0.89, e.clientX, e.clientY); }, { passive: false });

  svg.addEventListener('pointerdown', (e) => { dragging = true; svg._dragged = false; lastX = e.clientX; lastY = e.clientY; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) svg._dragged = true;
    const rect = svg.getBoundingClientRect();
    mapView.vbX -= dx / rect.width * mapView.vbW;
    mapView.vbY -= dy / rect.height * mapView.vbH;
    lastX = e.clientX; lastY = e.clientY;
    applyVB();
  });
  svg.addEventListener('pointerup', () => { dragging = false; });
  svg.addEventListener('pointercancel', () => { dragging = false; });

  // pinch-to-zoom touch
  const touches = new Map();
  svg.addEventListener('touchstart', (e) => { for (const t of e.changedTouches) touches.set(t.identifier, t); }, { passive: true });
  svg.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const [a, b] = [e.touches[0], e.touches[1]];
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const midX = (a.clientX + b.clientX) / 2, midY = (a.clientY + b.clientY) / 2;
      if (pinchDist) zoomAt(pinchDist / dist, midX, midY);
      pinchDist = dist;
    }
  }, { passive: false });
  svg.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinchDist = 0; }, { passive: true });
}


function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveNote();
});

function goToPage(target) {
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.getAttribute('data-page') === target));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(target).classList.add('active');
  document.getElementById('saveBtn').style.display = (target === 'writePage') ? 'flex' : 'none';
  if (target === 'mapPage') renderMap();
  if (target === 'catPage') renderCategories();
  if (target === 'todoPage') renderTodos();
}

document.querySelectorAll('.navbtn').forEach(btn => {
  btn.onclick = () => goToPage(btn.getAttribute('data-page'));
});

document.getElementById('bellBtn').onclick = () => goToPage('todoPage');

(function setHero() {
  const today = new Date();
  const dayNum = Math.floor(today.getTime() / 86400000); // cambia ogni giorno a mezzanotte
  const img = document.getElementById('heroImg');
  const wrap = document.getElementById('heroFull');
  img.onerror = () => { img.style.display = 'none'; wrap.classList.add('fallback'); };
  img.src = `https://loremflickr.com/900/500/night,city,traffic,lights?lock=${dayNum}`;
  const h = today.getHours();
  const greet = h < 6 ? 'Ancora sveglio' : h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
  document.getElementById('heroGreet').textContent = greet;
  document.getElementById('heroDate').textContent = today.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
})();

};

// avvio: se torniamo dal redirect OAuth con ?code=..., completiamo il login
(async function boot(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    setStatus('completo il collegamento…');
    const ok = await dbxExchangeCode(code);
    window.history.replaceState({}, '', DBX_REDIRECT); // pulisce l'URL dal code
    if (!ok) { setStatus('collegamento fallito, riprova'); updateAuthUI(); return; }
  }
  loadNotes();
})();
